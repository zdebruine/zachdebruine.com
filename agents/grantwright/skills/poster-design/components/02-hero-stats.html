<!--
  COMPONENT 02 — HERO STATS BAND
  =================================================================
  Required. Sits directly under the header rule.
  3 or 4 hero stats; each is a big serif number + unit + 1-line label.
  Number is "Newsreader" serif at 70px with -0.025em tracking.
  Unit is "Inter" sans at 38px in --accent-ink.

  Content fields:
    hero_stats[].number       — string (e.g. "40–60", "5–7", "1", "2.17")
    hero_stats[].unit         — string (e.g. "%", "yr", " in 10", " PB"); HTML-safe
    hero_stats[].label_html   — 1-line label, may contain <b>...</b> for callout phrase

  Visual rules:
    - The first stat has padding-left: 0.
    - The last stat has padding-right: 0 and no right border.
    - 3 or 4 columns; never more, never fewer.
-->
<div class="hero-stats">
    {% for s in hero_stats %}
    <div class="stat">
        <div class="n">{{ s.number }}<span class="u">{{ s.unit }}</span></div>
        <div class="l">{{ s.label_html }}</div>
    </div>
    {% endfor %}
</div>
